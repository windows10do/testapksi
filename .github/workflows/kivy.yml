name: Build Kivy Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "App mode"
        required: true
        default: "text"
        type: choice
        options:
          - text
          - button
          - slider
          - counter
          - checkbox
          - input
          - switch
          - progress

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Kivy project
        env:
          APP_MODE: ${{ inputs.mode }}
        run: |
          mkdir -p app/mode

          cat > app/mode/main.py <<PY
          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.uix.button import Button
          from kivy.uix.slider import Slider
          from kivy.uix.checkbox import CheckBox
          from kivy.uix.textinput import TextInput
          from kivy.uix.switch import Switch
          from kivy.uix.progressbar import ProgressBar

          MODE = "${APP_MODE}"


          class MainWidget(BoxLayout):

              def __init__(self, **kwargs):
                  super().__init__(
                      orientation="vertical",
                      padding=40,
                      spacing=20,
                      **kwargs
                  )

                  if MODE == "button":
                      self.add_widget(
                          Label(
                              text="Button Mode",
                              font_size="30sp"
                          )
                      )

                      self.status = Label(
                          text="Press the button!",
                          font_size="22sp"
                      )

                      self.add_widget(self.status)

                      button = Button(
                          text="Click me",
                          font_size="24sp"
                      )

                      button.bind(on_press=self.clicked)

                      self.add_widget(button)


                  elif MODE == "slider":
                      self.add_widget(
                          Label(
                              text="Slider Mode",
                              font_size="30sp"
                          )
                      )

                      self.value_label = Label(
                          text="Value: 50",
                          font_size="24sp"
                      )

                      self.add_widget(self.value_label)

                      slider = Slider(
                          min=0,
                          max=100,
                          value=50
                      )

                      slider.bind(
                          value=self.slider_changed
                      )

                      self.add_widget(slider)


                  elif MODE == "counter":
                      self.add_widget(
                          Label(
                              text="Counter Mode",
                              font_size="30sp"
                          )
                      )

                      self.count = 0

                      self.counter_label = Label(
                          text="Count: 0",
                          font_size="28sp"
                      )

                      self.add_widget(
                          self.counter_label
                      )

                      button = Button(
                          text="Increase",
                          font_size="24sp"
                      )

                      button.bind(
                          on_press=self.increase
                      )

                      self.add_widget(button)


                  elif MODE == "checkbox":
                      self.add_widget(
                          Label(
                              text="Checkbox Mode",
                              font_size="30sp"
                          )
                      )

                      self.status = Label(
                          text="Unchecked",
                          font_size="24sp"
                      )

                      self.add_widget(self.status)

                      checkbox = CheckBox(
                          active=False
                      )

                      checkbox.bind(
                          active=self.checkbox_changed
                      )

                      self.add_widget(checkbox)


                  elif MODE == "input":
                      self.add_widget(
                          Label(
                              text="Text Input Mode",
                              font_size="30sp"
                          )
                      )

                      self.input = TextInput(
                          hint_text="Type something...",
                          font_size="24sp",
                          multiline=False
                      )

                      self.add_widget(self.input)

                      button = Button(
                          text="Show text",
                          font_size="24sp"
                      )

                      button.bind(
                          on_press=self.show_text
                      )

                      self.add_widget(button)

                      self.result = Label(
                          text="",
                          font_size="22sp"
                      )

                      self.add_widget(self.result)


                  elif MODE == "switch":
                      self.add_widget(
                          Label(
                              text="Switch Mode",
                              font_size="30sp"
                          )
                      )

                      self.status = Label(
                          text="OFF",
                          font_size="28sp"
                      )

                      self.add_widget(self.status)

                      switch = Switch(
                          active=False
                      )

                      switch.bind(
                          active=self.switch_changed
                      )

                      self.add_widget(switch)


                  elif MODE == "progress":
                      self.add_widget(
                          Label(
                              text="Progress Mode",
                              font_size="30sp"
                          )
                      )

                      self.progress = ProgressBar(
                          max=100,
                          value=0
                      )

                      self.add_widget(
                          self.progress
                      )

                      button = Button(
                          text="Increase Progress",
                          font_size="24sp"
                      )

                      button.bind(
                          on_press=self.increase_progress
                      )

                      self.add_widget(button)


                  else:
                      self.add_widget(
                          Label(
                              text="Hello from Kivy!",
                              font_size="32sp"
                          )
                      )

                      self.add_widget(
                          Label(
                              text="Text mode",
                              font_size="24sp"
                          )
                      )


              def clicked(self, instance):
                  self.status.text = "Button clicked!"


              def slider_changed(self, instance, value):
                  self.value_label.text = (
                      "Value: " + str(int(value))
                  )


              def increase(self, instance):
                  self.count += 1

                  self.counter_label.text = (
                      "Count: " + str(self.count)
                  )


              def checkbox_changed(self, instance, value):
                  if value:
                      self.status.text = "Checked"
                  else:
                      self.status.text = "Unchecked"


              def show_text(self, instance):
                  self.result.text = self.input.text


              def switch_changed(self, instance, value):
                  if value:
                      self.status.text = "ON"
                  else:
                      self.status.text = "OFF"


              def increase_progress(self, instance):
                  self.progress.value += 10

                  if self.progress.value >= 100:
                      self.progress.value = 0


          class MyApp(App):

              def build(self):
                  return MainWidget()


          MyApp().run()
          PY

          cat > app/mode/buildozer.spec <<'SPEC'
          [app]

          title = Kivy Modes App
          package.name = kivymodes
          package.domain = org.example

          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas

          version = 1.0

          requirements = python3,kivy

          orientation = portrait

          fullscreen = 0

          android.api = 34
          android.minapi = 23

          android.archs = arm64-v8a

          android.allow_backup = True

          [buildozer]

          log_level = 2
          warn_on_root = 1
          SPEC

          echo "Created Kivy project:"
          find app/mode -maxdepth 2 -type f -print

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3 \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv

          . .venv/bin/activate

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "cython==0.29.37" \
            "buildozer==1.5.0"

          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify Buildozer
        run: |
          buildozer --version
          cython --version
          python3 --version
          java -version

      - name: Build APK
        working-directory: app/mode
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "KIVY ANDROID BUILD"
          echo "MODE: ${{ inputs.mode }}"
          echo "PROJECT: app/mode"
          echo "========================================"

          rm -rf .buildozer
          rm -rf bin

          buildozer -v android debug 2>&1 \
            | tee "$GITHUB_WORKSPACE/buildozer.log"

      - name: Show build files
        if: always()
        run: |
          echo "===== PROJECT ====="
          find app/mode -maxdepth 3 -type f | sort || true

          echo "===== APK ====="
          find app/mode/bin \
            -type f \
            -name "*.apk" \
            -ls 2>/dev/null || true

      - name: Collect APK
        if: success()
        run: |
          mkdir -p output

          find app/mode/bin \
            -type f \
            -name "*.apk" \
            -exec cp {} output/ \;

          ls -lh output/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kivy-${{ inputs.mode }}-apk
          path: output/*.apk
          if-no-files-found: error

      - name: Upload Buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log-${{ inputs.mode }}
          path: buildozer.log
          if-no-files-found: warn

      - name: Upload build debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-debug-${{ inputs.mode }}
          path: |
            app/mode/.buildozer
            app/mode/bin
          if-no-files-found: ignore