name: Build Kivy Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "App mode"
        required: true
        default: "text"
        type: choice
        options:
          - text
          - button
          - slider

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Kivy project
        env:
          APP_MODE: ${{ inputs.mode }}
        run: |
          mkdir -p app

          cat > app/main.py <<'PY'
          import os

          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.uix.button import Button
          from kivy.uix.slider import Slider


          MODE = os.environ.get("APP_MODE", "text")


          class MainWidget(BoxLayout):
              def __init__(self, **kwargs):
                  super().__init__(
                      orientation="vertical",
                      padding=40,
                      spacing=20,
                      **kwargs
                  )

                  if MODE == "button":
                      self.add_widget(
                          Label(
                              text="Kivy Button Mode",
                              font_size="28sp"
                          )
                      )

                      self.status = Label(
                          text="Press the button!",
                          font_size="22sp"
                      )
                      self.add_widget(self.status)

                      button = Button(
                          text="Click me",
                          font_size="24sp"
                      )
                      button.bind(on_press=self.clicked)
                      self.add_widget(button)

                  elif MODE == "slider":
                      self.add_widget(
                          Label(
                              text="Kivy Slider Mode",
                              font_size="28sp"
                          )
                      )

                      self.value_label = Label(
                          text="Value: 50",
                          font_size="24sp"
                      )
                      self.add_widget(self.value_label)

                      slider = Slider(
                          min=0,
                          max=100,
                          value=50
                      )
                      slider.bind(value=self.slider_changed)
                      self.add_widget(slider)

                  else:
                      self.add_widget(
                          Label(
                              text="Hello from Kivy!",
                              font_size="32sp"
                          )
                      )

                      self.add_widget(
                          Label(
                              text="Text mode",
                              font_size="24sp"
                          )
                      )

              def clicked(self, instance):
                  self.status.text = "Button clicked!"

              def slider_changed(self, instance, value):
                  self.value_label.text = f"Value: {int(value)}"


          class MyApp(App):
              def build(self):
                  return MainWidget()


          MyApp().run()
          PY

          cat > app/buildozer.spec <<'SPEC'
          [app]

          title = Kivy Modes App
          package.name = kivymodes
          package.domain = org.example

          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas

          version = 1.0

          requirements = python3,kivy

          orientation = portrait

          fullscreen = 0

          android.api = 35
          android.minapi = 23

          android.archs = arm64-v8a, armeabi-v7a

          android.allow_backup = True

          [buildozer]

          log_level = 2
          warn_on_root = 1
          SPEC

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: Build APK
        working-directory: app
        env:
          APP_MODE: ${{ inputs.mode }}
        run: |
          buildozer android debug

      - name: Find APK
        run: |
          mkdir -p output
          find app/bin -type f -name "*.apk" -exec cp {} output/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-${{ inputs.mode }}-apk
          path: output/*.apk